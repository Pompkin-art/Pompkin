<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — Pompkin</title><link rel="stylesheet" href="style.css"></head><body><main><section class="page-hero"><div class="container"><p class="hero-eyebrow">your space</p><h1>Profile</h1></div></section><section class="section"><div class="container"><div id="profileView" class="form-card">Loading profile…</div><div id="profileEdit" class="form-card" style="display:none;margin-top:20px"><h2>Edit Profile</h2><form id="profileForm" class="form-grid"><div class="form-group"><label>Username</label><input name="username" required></div><div class="form-group"><label>Email</label><input name="email" disabled></div><div class="form-group"><label>Full name</label><input name="name" disabled></div><div class="form-group"><label>Mobile</label><input name="mobile"></div><div class="form-group full"><label>Bio</label><textarea name="bio"></textarea></div><div class="form-group full"><button class="button button-orange">Save Changes</button></div></form><p id="profileMsg"></p></div><div class="form-card" style="margin-top:20px"><h2>Saved Shipping Addresses</h2><div id="addresses"></div><form id="addressForm" class="form-grid" style="margin-top:20px"><div class="form-group"><label>Address label</label><input name="label" placeholder="Home"></div><div class="form-group"><label>Recipient name</label><input name="recipient" required></div><div class="form-group"><label>Mobile number</label><input name="mobile"></div><div class="form-group full"><label>Full shipping address</label><textarea name="full_address" required placeholder="House/unit, street, barangay, city, province, postal code"></textarea></div><div class="form-group"><label><input name="primary" type="checkbox"> Primary address</label></div><div class="form-group"><button class="button button-orange">Save Address</button></div></form><p id="addressMsg"></p></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="base.js"></script><script src="profile.js"></script></body></html>
