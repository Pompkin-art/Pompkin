<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Manage Bids | Pompkin</title><link rel="stylesheet" href="style.css"></head><body class="admin-body"><header class="admin-header"><div class="container admin-header-inner"><a href="index.html" class="logo">Pompkin</a><div class="admin-header-actions"><span class="admin-label">Bids</span><a href="admin.html" class="admin-view-site">Admin</a><a href="index.html" class="admin-view-site">View site</a><button id="adminLogout" class="button button-outline" type="button">Log Out</button></div></div></header><main class="admin-main"><div class="container"><div id="adminState" class="admin-state"><p>Checking your admin access…</p></div><div id="adminApp" hidden><div class="admin-title-row"><div><p class="section-label">art auctions 𐙚</p><h1>Manage Bids</h1><p>Create an auction, set the starting price, and decide when it closes.</p></div></div><section class="admin-card admin-auction-form"><form id="auctionForm" class="admin-form"><label>Artwork title<input id="auctionTitle" required></label><label>Description<textarea id="auctionDescription" rows="4"></textarea></label><label>Artwork image URL<input id="auctionImage" type="url" placeholder="https://..."></label><div class="admin-form-grid"><label>Starting bid (₱)<input id="auctionStarting" type="number" min="0" step="1" required></label><label>Minimum increment (₱)<input id="auctionIncrement" type="number" min="1" step="1" value="10" required></label><label>Starts<input id="auctionStarts" type="datetime-local" required></label><label>Ends<input id="auctionEnds" type="datetime-local" required></label></div><button class="button button-orange" type="submit">PUBLISH AUCTION</button><p id="auctionMessage" class="admin-form-message"></p></form></section><section class="admin-card admin-table-card"><div id="auctionList"></div></section></div></div></main><script type="module" src="admin-bids.js"></script></body></html>
