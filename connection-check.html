<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connection Check — Pompkin</title><link rel="stylesheet" href="style.css"></head><body><main><section class="page-hero"><div class="container"><p class="hero-eyebrow">setup helper</p><h1>Connection Check</h1></div></section><section class="section"><div class="container"><div id="checks" class="form-card">Checking…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="base.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{let out=[];const {error:a}=await db.from('profiles').select('id').limit(1);out.push(['Supabase connected',!a||!String(a.message||'').includes('fetch')]);const u=await currentUser();out.push(['Auth signed in',!!u]);if(u){const {error:p}=await db.from('profiles').select('id').eq('id',u.id).maybeSingle();out.push(['Profile DB connected',!p]);}const {error:pr}=await db.from('pompkin_products').select('id').limit(1);out.push(['Products DB connected',!pr]);checks.innerHTML=out.map(x=>`<p><strong>${x[1]?'✓':'✕'}</strong> ${x[0]}</p>`).join('')})</script></body></html>
